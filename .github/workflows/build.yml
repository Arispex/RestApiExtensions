name: Build RestApiExtensions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore RestApiExtensions.sln

      - name: Build
        run: dotnet build RestApiExtensions.sln --configuration Release --no-restore

      - name: Generate release timestamp
        id: release_meta
        run: |
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.timestamp }}
          name: ${{ steps.release_meta.outputs.timestamp }}
          make_latest: true
          files: RestApiExtensions/bin/Release/net9.0/RestApiExtensions.dll
